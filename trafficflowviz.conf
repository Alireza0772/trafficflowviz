# TrafficFlowViz Configuration File
# This file contains the default configuration for the TrafficFlowViz application

# Application Settings
app.title=Traffic Flow Visualization
app.window.width=1280
app.window.height=720
app.renderer=SDL
app.fullscreen=false
app.vsync=true

# Performance Settings
perf.max_fps=60
perf.max_vehicles=100000
perf.simulation_timestep=0.016
perf.worker_threads=8

# File Paths (relative to executable or working directory)
paths.data_dir=data
paths.assets_dir=assets
paths.output_dir=output
paths.logs_dir=logs
paths.recordings_dir=recordings
paths.shaders_dir=shaders

# Data Files
data.vehicles_file=vehicles/vehicles.csv
data.city_file=roads/roads_complex.csv
data.icon_file=icon.png

# Networking Settings
network.websocket_url=ws://localhost:8080
network.websocket_port=8080
network.kafka_brokers=localhost:9092
network.max_message_rate=10000

# Feature Flags
features.heatmap_enabled=false
features.alerts_enabled=false
features.recording_enabled=false
features.metrics_enabled=true
features.debug_mode=false